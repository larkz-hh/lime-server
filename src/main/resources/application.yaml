spring:
  application:
    name: lime_server

  # .env 格式为 KEY=VALUE，与 docker-compose 共用同一份
  config:
    import:
      - optional:file:.env[.properties]
      - classpath:prompts.yaml

  # ===== 数据源 =====
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0

  # ===== 邮件 SMTP =====
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  sql:
    init:
      mode: always

  # ===== 文件上传大小限制（视频笔记 200MB） =====
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

  # ===== MVC 异步请求超时（SSE 流式接口用，需大于 AI 流式总时长） =====
  mvc:
    async:
      request-timeout: 120000

# ===== MyBatis-Plus =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      # 逻辑删除（deleted 字段：1=已删除，0=正常）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== RocketMQ =====
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: lime-producer-group
  consumer:
    group: lime-notification-group

# ===== 自定义配置（ @ConfigurationProperties 类读取） =====

# MinIO 对象存储
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # 返回给客户端（Android/浏览器）的可访问地址，不设置则与 endpoint 相同
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: ${MINIO_BUCKET:lime-bucket}

# JWT
jwt:
  secret: ${JWT_SECRET}
  expire: 7200          # access token 有效期，单位秒（2小时）
  refresh-expire: 604800 # refresh token 有效期，单位秒（7天）

# 腾讯云即时通信 IM 
im:
  sdk-app-id: ${IM_SDK_APP_ID:0}
  secret-key: ${IM_SECRET_KEY:}
  user-sig-expire: 604800   # UserSig 有效期（秒），默认 7 天
  user-id-prefix: "lime_"   # IM UserID 前缀

# ===== AI 大模型（OpenAI 兼容协议，默认 DeepSeek） =====
ai:
  # 服务地址不带末尾斜杠；换通义/Kimi/Ollama 等改这里即可
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  # API Key 在 .env 的 AI_API_KEY 配置
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-v4-flash}
  vision-model: ${AI_VISION_MODEL:deepseek-v4-flash-vision-exp}
  connect-timeout-seconds: 5
  read-timeout-seconds: 90
  # 限流：写作/聊天每用户每分钟 5 次、每天 50 次
  rate-limit-per-minute: 5
  rate-limit-per-day: 50
  # 翻译限流（短文本、频率高，单独放宽）
  translate-rate-limit-per-minute: 10
  translate-rate-limit-per-day: 100
  chat-context-max-messages: 20
  # 滚动摘要：未压缩消息超过 30 条时，把最早最多 10 条压成摘要（压缩后至少保留 20 条原文）
  summarize-trigger: 30
  summarize-batch: 10
  # 会话标题：每次回复后让模型动态判断是否更新，标题最长 15 字
  title-max-length: 15
  max-message-length: 2000
  max-images: 4
  # 本地开发 true：后端从内网 MinIO 下载图片转 base64 给 AI
  # 生产 false 传公网 URL
  images-as-base64: ${AI_IMAGES_AS_BASE64:false}
  # 轻量任务（标题总结/摘要/翻译），留空则复用主模型
  light-base-url: ${AI_LIGHT_BASE_URL:}
  light-api-key: ${AI_LIGHT_API_KEY:}
  light-model: ${AI_LIGHT_MODEL:glm-4.7-flash}
  # Dots 模型
  dots-base-url: ${AI_DOTS_BASE_URL:}
  dots-api-key: ${AI_DOTS_API_KEY:}
  dots-enable-thinking: ${AI_DOTS_ENABLE_THINKING:false}
  # 翻译默认模型
  translate-model: ${AI_TRANSLATE_MODEL:dots3-note-prev}
  # Tavily 联网搜索
  tavily-api-key: ${TAVILY_API_KEY:}
  # Kimi 模型
  kimi-base-url: ${AI_KIMI_BASE_URL:}
  kimi-api-key: ${AI_KIMI_API_KEY:}
  kimi-enable-thinking: ${AI_KIMI_ENABLE_THINKING:false}

server:
  port: 8080
